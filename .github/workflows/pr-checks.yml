# Runs on every pull request.
# Fails if the PR is not linked to an open issue, or the branch name breaks our rules.
# Add "PR checks / linked-issue" as a required status check on dev and main.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;
            const base = pr.base.ref;

            // The final release PR (dev -> main) does not need an issue.
            if (base === 'main') {
              if (head !== 'dev') core.setFailed('Only dev can be merged into main.');
              else core.info('Release PR from dev to main. OK.');
              return;
            }

            // Work branches must target dev and follow the naming rule.
            if (base !== 'dev') {
              core.setFailed(`Pull requests must target dev, not ${base}.`);
              return;
            }
            const nameRule = /^(feature|fix|docs|chore|test|refactor)\/VM-\d+-[a-z0-9-]+$/;
            if (!nameRule.test(head)) {
              core.setFailed(`Branch "${head}" must look like feature/VM-12-short-name (types: feature, fix, docs, chore, test, refactor).`);
              return;
            }

            // The description must close at least one issue.
            const body = pr.body || '';
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => Number(m[1]));
            if (refs.length === 0) {
              core.setFailed('Add "Closes #<issue number>" to the pull request description.');
              return;
            }

            // Each linked issue must exist, be an issue (not a PR) and be open.
            for (const n of refs) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n }));
              } catch {
                core.setFailed(`Issue #${n} was not found.`);
                return;
              }
              if (issue.pull_request) { core.setFailed(`#${n} is a pull request, not an issue.`); return; }
              if (issue.state !== 'open') { core.setFailed(`Issue #${n} is already closed.`); return; }
            }

            // The branch number should match a linked issue.
            const branchIssue = Number(head.match(/VM-(\d+)/)[1]);
            if (!refs.includes(branchIssue)) {
              core.setFailed(`Branch is for VM-${branchIssue} but the description does not close #${branchIssue}.`);
              return;
            }

            core.info(`Linked to issue(s): ${refs.map(n => '#' + n).join(', ')}`);

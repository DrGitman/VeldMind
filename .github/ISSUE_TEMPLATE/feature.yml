name: Feature
description: Something new to build
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should be built?
      description: Simple words. Link the Figma screen if there is one.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished.
      placeholder: "- The farmer can ...\n- Works offline"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [app, api, gateway, firmware, supabase, ml, docs]
    validations:
      required: true
